<p id="tip" hidden>💠荔枝虽好，可不要贪吃哦！</p>
<script>
function showTipWithInput() {
  var input = document.getElementById('pwdInput');
  var password = input.value;
  var correctPassword = '123456';
  if (password === correctPassword) {
    document.getElementById('tip').hidden = false;
    alert('✅密码正确，小贴士已显示！');
  } else {
    alert('❌密码错误，请重试！');
    input.value = ''; // 清空输入框
    input.focus();    // 让输入框重新获得焦点
  }
}
</script>
